name: Tally CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and Code Quality Check
        run: |
          ruff check .

      - name: Generate Synthetic Data Verification
        run: |
          python data/generate.py --months 2 --seed 42 --format parquet

      - name: Run Test Suite (Concurrency, Warehouse SQL, API, Reports)
        run: |
          pytest -v --cov=src/tally --cov-report=term-missing
