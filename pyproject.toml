[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-analytics"
version = "0.1.0"
description = "Tally: Agent Operations Analytics Pipeline - Contact layer, Value ledger, and Defensible team maturity grading"
readme = "README.md"
authors = [
    { name = "Harsh", email = "harshkarn12345@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "duckdb>=0.10.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "faker>=24.0.0",
    "streamlit>=1.32.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.19.0",
    "google-cloud-storage>=2.14.0",
    "db-dtypes>=1.2.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
tally = "tally.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "warehouse/tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
